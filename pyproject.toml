[project]
name = "company-research-lab"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = [
  "SQLAlchemy==2.0.52",
  "alembic==1.19.2",
  "psycopg[binary]==3.3.5",
  "simplejson==3.20.2",
  "pandas==2.3.3",
  "pyarrow==23.0.1",
  "linearmodels==7.0",
  "statsmodels==0.14.6",
  "matplotlib==3.11.2",
  "fastapi==0.141.1",
  "uvicorn==0.52.4",
  "redis[hiredis]>=5.0",
  "rq>=1.16",
]

[project.optional-dependencies]
test = ["pytest==9.1.1", "httpx==0.28.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: requires a migrated test PostgreSQL database"]
